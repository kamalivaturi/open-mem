<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="open-mem: free, local, long-term memory for Claude Code">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1b3a"/>
      <stop offset="0.55" stop-color="#2d2a6e"/>
      <stop offset="1" stop-color="#5b5bd6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#a5a5ff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#a5a5ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
  </defs>
  <rect width="1280" height="320" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="28" fill="url(#dots)"/>
  <rect width="1280" height="320" rx="28" fill="url(#glow)"/>

  <!-- memory graph motif -->
  <g stroke="#c7c7ff" stroke-opacity="0.35" stroke-width="2" fill="none">
    <path d="M930 96 L1040 70 L1150 118 L1080 200 L960 214 Z"/>
    <path d="M1040 70 L1080 200 M930 96 L1080 200 M960 214 L1150 118"/>
  </g>
  <g fill="#ffffff">
    <circle cx="930" cy="96" r="7" fill-opacity="0.9"/>
    <circle cx="1040" cy="70" r="10"/>
    <circle cx="1150" cy="118" r="7" fill-opacity="0.9"/>
    <circle cx="1080" cy="200" r="12" fill="#ffdd00"/>
    <circle cx="960" cy="214" r="7" fill-opacity="0.9"/>
  </g>

  <!-- logo -->
  <rect x="72" y="84" width="96" height="96" rx="24" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.25"/>
  <path d="M99 154V110l21 18 21-18v44" stroke="#ffffff" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <g font-family="Inter, 'SF Pro Display', 'Segoe UI', -apple-system, system-ui, sans-serif" fill="#ffffff">
    <text x="196" y="146" font-size="64" font-weight="700" letter-spacing="-1.5">open-mem</text>
    <text x="198" y="184" font-size="24" fill-opacity="0.85">Free, local, long-term memory for Claude Code</text>
  </g>

  <!-- pills -->
  <g font-family="Inter, 'SF Pro Display', 'Segoe UI', -apple-system, system-ui, sans-serif" font-size="15" font-weight="600" fill="#ffffff">
    <rect x="72" y="226" width="118" height="34" rx="17" fill="#ffffff" fill-opacity="0.14"/><text x="131" y="248" text-anchor="middle">100% local</text>
    <rect x="200" y="226" width="140" height="34" rx="17" fill="#ffffff" fill-opacity="0.14"/><text x="270" y="248" text-anchor="middle">0 dependencies</text>
    <rect x="350" y="226" width="150" height="34" rx="17" fill="#ffffff" fill-opacity="0.14"/><text x="425" y="248" text-anchor="middle">Obsidian-native</text>
    <rect x="510" y="226" width="148" height="34" rx="17" fill="#ffffff" fill-opacity="0.14"/><text x="584" y="248" text-anchor="middle">Free models</text>
    <rect x="668" y="226" width="196" height="34" rx="17" fill="#ffffff" fill-opacity="0.14"/><text x="766" y="248" text-anchor="middle">All your Claude history</text>
  </g>
</svg>
